<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Banker's Algorithm: The Vault</title>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Instrument+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head>
<body><main>
<h1>Banker's<br>algorithm</h1>
<p class="sub">Processes orbit a vault of resources. Ask for a safe sequence and watch it route around the ring, let the algorithm run the bank, switch it to reckless and wait for deadlock, or take the chair yourself and decide every request.</p>
<div class="grid">
<div><canvas id="cv" aria-label="Vault with processes orbiting it"></canvas></div>
<aside>
<div class="row"><label>Mode<select id="mode"><option value="safe">Banker's AI (safe only)</option><option value="reck">Reckless AI (grants anything free)</option><option value="me">You are the banker</option></select></label>
<label>Speed<input id="spd" type="range" min="1" max="10" value="6"></label></div>
<div class="row"><button id="solve">Solve</button><button id="run">Run</button><button class="g" id="step">Step</button><button class="g" id="rst">Reset</button></div>
<div id="hud"></div><div id="ask"></div><ol id="log" aria-live="polite"></ol>
</aside></div>

<section class="led"><h2>Ledger</h2>
<div class="row"><label>Processes<input id="n" type="number" min="1" max="10" value="5"></label><label>Resources<input id="m" type="number" min="1" max="8" value="3"></label>
<button class="g" id="size">Apply size</button><button class="g" id="ex">Textbook</button><button class="g" id="trap">Deadlock trap</button><button class="g" id="rand">Random</button><button class="g" id="clr">Clear</button></div>
<div class="sc"><table id="tbl"></table></div><div class="sc" style="margin-top:12px"><table id="avl" style="min-width:0"></table></div>
</section></main>
<script src="js/core.js"></script>
<script src="js/algorithm.js"></script>
<script src="js/ledger.js"></script>
<script src="js/ui.js"></script>
<script src="js/solve.js"></script>
<script src="js/simulation.js"></script>
<script src="js/canvas.js"></script>
<script src="js/main.js"></script></body></html>
